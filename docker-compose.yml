version: '3.8'
services:
  web:
    image: php:8.2-apache
    container_name: cafe_serrano_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: cafe_serrano_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cafe_serrano
    ports:
      - "3306:3306"